; PlatformIO Project Configuration File
;
; Cible : Quoridor mecatronique - firmware ESP32-WROOM (Freenove)
; Plan 1 : squelette + FSM globale + integration FreeRTOS
;
; Documentation : https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
; Env par defaut : compile le sketch de production validee (CoreXY + servo + capteurs).
; Apres archivage de main.cpp/modules Plan 2 (2026-05-20), bringup_l298n_complet.cpp
; est le firmware actif sur breadboard.
platform = espressif32
board = esp32dev
framework = arduino

; Vitesse de communication serie (matche Serial.begin dans le sketch)
monitor_speed = 115200

; Vitesse d'upload (USB direct - 460800 stable, monter a 921600 si besoin)
upload_speed = 460800

; Filtre direct = output brut sans timestamp ajoute
monitor_filters = direct

; Build flags
build_flags =
  -Wall
  -Wno-unused-parameter

lib_deps =
  madhephaestus/ESP32Servo@^3.0.5

; Compile uniquement le sketch de production CoreXY + servo + capteurs
build_src_filter = -<*> +<bringup_l298n_complet.cpp>


; -----------------------------------------------------------------------------
; Env L298N - integration complete : CoreXY + capteurs + servo.
; HOME execute automatiquement au boot. Commandes GOTO, X/Y F/B, LEVER, etc.
; Flash : pio run -e bringup_l298n_complet -t upload
; -----------------------------------------------------------------------------
[env:bringup_l298n_complet]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
monitor_filters = direct
build_flags =
  -Wall
  -Wno-unused-parameter
lib_deps =
  madhephaestus/ESP32Servo@^3.0.5
  adafruit/Adafruit NeoPixel @ ^1.12.0

build_src_filter = -<*> +<bringup_l298n_complet.cpp>


; -----------------------------------------------------------------------------
; Env LED - validation complete (5 phases en boucle, autonome).
; Phase 1 : LED 0 blanc (GPIO + lib + cablage DIN)
; Phase 2 : 4 coins du strip (orientation physique)
; Phase 3 : chenillard 0 -> 35 (sens serpentin)
; Phase 4 : 4 coins grille engine (formule engine_to_strip_index)
; Phase 5 : positions de depart Quoridor (J1 bleu, J2 rouge)
; Flash : pio run -e bringup_led_check -t upload
; -----------------------------------------------------------------------------
[env:bringup_led_check]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
monitor_filters = direct
build_flags =
  -Wall
  -Wno-unused-parameter
lib_deps =
  adafruit/Adafruit NeoPixel @ ^1.12.0

build_src_filter = -<*> +<bringup_led_check.cpp>


