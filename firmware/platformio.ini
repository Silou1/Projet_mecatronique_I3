; PlatformIO Project Configuration File
;
; Cible : Quoridor mecatronique - firmware ESP32-WROOM (Freenove)
; Plan 1 : squelette + FSM globale + integration FreeRTOS
;
; Documentation : https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
; Env par defaut : compile le sketch de production validee (CoreXY + servo + capteurs).
; Apres archivage de main.cpp/modules Plan 2 (2026-05-20), bringup_l298n_complet.cpp
; est le firmware actif sur breadboard.
platform = espressif32
board = esp32dev
framework = arduino

; Vitesse de communication serie (matche Serial.begin dans le sketch)
monitor_speed = 115200

; Vitesse d'upload (USB direct - 460800 stable, monter a 921600 si besoin)
upload_speed = 460800

; Filtre direct = output brut sans timestamp ajoute
monitor_filters = direct

; Build flags
build_flags =
  -Wall
  -Wno-unused-parameter

lib_deps =
  madhephaestus/ESP32Servo@^3.0.5

; Compile uniquement le sketch de production CoreXY + servo + capteurs
build_src_filter = -<*> +<bringup_l298n_complet.cpp>


; -----------------------------------------------------------------------------
; Env de bring-up breadboard - test fin de course seul.
; Flash   : pio run -e bringup_limit_switch -t upload
; Monitor : pio device monitor
; -----------------------------------------------------------------------------
[env:bringup_limit_switch]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
monitor_filters = direct
build_flags =
  -Wall
  -Wno-unused-parameter

; Ne compile QUE le sketch de test fin de course
build_src_filter = -<*> +<bringup_limit_switch.cpp>


; -----------------------------------------------------------------------------
; Env de bring-up breadboard - test moteur 1 via pont en H L298N.
; Flash   : pio run -e bringup_motor1_l298n -t upload
; Monitor : pio device monitor
; -----------------------------------------------------------------------------
[env:bringup_motor1_l298n]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
monitor_filters = direct
build_flags =
  -Wall
  -Wno-unused-parameter

; Ne compile QUE le sketch de test moteur 1 via L298N
build_src_filter = -<*> +<bringup_motor1_l298n.cpp>


; -----------------------------------------------------------------------------
; Env L298N - controle independant : 2 L298N + 2 moteurs + capteurs + servo.
; Tout OFF au boot. Commandes EN1/EN2/EN, M1/M2 F/B, SERVO, LIMITS, etc.
; Flash : pio run -e bringup_l298n_indep -t upload
; -----------------------------------------------------------------------------
[env:bringup_l298n_indep]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
monitor_filters = direct
build_flags =
  -Wall
  -Wno-unused-parameter
lib_deps =
  madhephaestus/ESP32Servo@^3.0.5

build_src_filter = -<*> +<bringup_l298n_indep.cpp>


; -----------------------------------------------------------------------------
; Env L298N - integration complete : CoreXY + capteurs + servo.
; HOME execute automatiquement au boot. Commandes GOTO, X/Y F/B, LEVER, etc.
; Flash : pio run -e bringup_l298n_complet -t upload
; -----------------------------------------------------------------------------
[env:bringup_l298n_complet]
platform = espressif32
board = esp32dev
