; PlatformIO Project Configuration File
;
; Cible : Quoridor mecatronique - firmware ESP32-WROOM (Freenove)
; Plan 1 : squelette + FSM globale + integration FreeRTOS
;
; Documentation : https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Vitesse de communication serie (matche Serial.begin dans main.cpp)
monitor_speed = 115200

; Vitesse d'upload (USB direct - 460800 stable, monter a 921600 si besoin)
upload_speed = 460800

; Filtre direct = output brut sans timestamp ajoute
monitor_filters = direct

; Build flags
build_flags =
  -Wall
  -Wno-unused-parameter

; Exclut tous les sketches de bring-up : ils ont leur propre env
build_src_filter = +<*> -<bringup_*.cpp>


; -----------------------------------------------------------------------------
; Env de bring-up breadboard - test fin de course seul.
; Flash   : pio run -e bringup_limit_switch -t upload
; Monitor : pio device monitor
; -----------------------------------------------------------------------------
[env:bringup_limit_switch]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
monitor_filters = direct
build_flags =
  -Wall
  -Wno-unused-parameter

; Ne compile QUE le sketch de test fin de course
build_src_filter = -<*> +<bringup_limit_switch.cpp>


